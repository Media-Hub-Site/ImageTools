name: Build and Release MediaHub-ImageTools

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests
          pip install -r requirements.txt

      - name: Download Real-ESRGAN Models & Binaries
        shell: pwsh
        run: |
          $targetDir = "apps/models/realesrgan"
          if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
          
          $zipUrl = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          $tempZip = Join-Path $env:RUNNER_TEMP "realesrgan-windows.zip"
          $tempExtract = Join-Path $env:RUNNER_TEMP "realesrgan-extracted"

          Write-Host "Downloading Real-ESRGAN bundle from $zipUrl..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $tempZip -Headers @{ "User-Agent" = "Mozilla/5.0" }
          
          Write-Host "Extracting Real-ESRGAN bundle..."
          Expand-Archive -Path $tempZip -DestinationPath $tempExtract -Force
          
          # Copiar la carpeta models/ y ejecutables requeridos
          if (Test-Path (Join-Path $tempExtract "models")) {
            Copy-Item -Path (Join-Path $tempExtract "models") -Destination $targetDir -Recurse -Force
          }
          if (Test-Path (Join-Path $tempExtract "realesrgan-ncnn-vulkan.exe")) {
            Copy-Item -Path (Join-Path $tempExtract "realesrgan-ncnn-vulkan.exe") -Destination $targetDir -Force
          }
          foreach ($dll in @("vcomp140.dll", "vcomp140d.dll")) {
            $dllPath = Join-Path $tempExtract $dll
            if (Test-Path $dllPath) {
              Copy-Item -Path $dllPath -Destination $targetDir -Force
            }
          }

          Write-Host "Real-ESRGAN models and binaries ready for PyInstaller build."
          Get-ChildItem -Path $targetDir -Recurse | Select-Object Name

      - name: Build Executable with PyInstaller
        run: pyinstaller main.spec

      - name: Compress Build to ZIP
        run: |
          Compress-Archive -Path "dist\MediaHub-ImageTools\*" -DestinationPath "MediaHub-ImageTools.zip" -Force

      - name: Generate Release Tag Name
        id: tag_name
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            echo "TAG=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ github.ref }}" -match "refs/tags/") {
            echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            echo "TAG=v1.1.5-$date" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: "MediaHub-ImageTools ${{ steps.tag_name.outputs.TAG }}"
          files: |
            MediaHub-ImageTools.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
